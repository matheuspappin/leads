<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lead Hunter — Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css?v=5" />
  <style>
    /* Estilos específicos para garantir que a tela de login ocupe 100% da tela sempre */
    .auth-overlay {
      display: flex; /* Sempre visível na página de login */
    }
  </style>
</head>
<body>
<canvas id="particles-canvas"></canvas>

<!-- ═══════════════ AUTH CONTAINER ═══════════════ -->
<div class="auth-overlay" id="auth-overlay">
  <div class="auth-card" id="auth-card">

    <!-- Logo -->
    <div class="auth-logo">
      <span class="logo-text">LEAD<strong>HUNTER</strong></span>
    </div>

    <!-- Tab Switcher -->
    <div class="auth-tabs">
      <a href="/login" class="auth-tab">Entrar</a>
      <a href="/register" class="auth-tab active">Criar Conta</a>
    </div>

    <!-- REGISTER FORM -->
    <form id="form-register" class="auth-form" onsubmit="handleRegister(event)">
      <div class="auth-form-group">
        <label class="auth-label" for="reg-email">E-mail</label>
        <div class="auth-input-wrap">
          <svg class="auth-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><polyline points="22,6 12,13 2,6"/></svg>
          <input type="email" id="reg-email" class="auth-input" placeholder="seu@email.com" required autocomplete="email" />
        </div>
      </div>
      <div class="auth-form-group">
        <label class="auth-label" for="reg-password">Senha</label>
        <div class="auth-input-wrap">
          <svg class="auth-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <input type="password" id="reg-password" class="auth-input" placeholder="mínimo 6 caracteres" required autocomplete="new-password" minlength="6" />
          <button type="button" class="toggle-pw" onclick="togglePw('reg-password', this)" tabindex="-1">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>
      <div class="auth-form-group">
        <label class="auth-label" for="reg-confirm">Confirmar Senha</label>
        <div class="auth-input-wrap">
          <svg class="auth-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <input type="password" id="reg-confirm" class="auth-input" placeholder="repita a senha" required autocomplete="new-password" minlength="6" />
        </div>
      </div>
      <div class="auth-error" id="register-error"></div>
      <button type="submit" class="auth-btn" id="btn-register">
        <span id="btn-register-text">Criar Conta</span>
        <div class="auth-spinner" id="register-spinner" style="display:none;"></div>
      </button>
    </form>

  </div>
</div>

<!-- Supabase JS via CDN -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="register.js?v=7"></script>
</body>
</html>
